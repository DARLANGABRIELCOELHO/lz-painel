<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel de registros | LZ iPhones</title>
  <style>
    :root {
      --fundo: #f5f5f7;
      --cartao: #ffffff;
      --texto: #1d1d1f;
      --suave: #6e6e73;
      --linha: #d2d2d7;
      --destaque: #0071e3;
      --erro: #b00020;
      --raio: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --fundo: #000000;
        --cartao: #1c1c1e;
        --texto: #f5f5f7;
        --suave: #98989d;
        --linha: #38383a;
        --destaque: #2997ff;
        --erro: #ff6b6b;
      }
    }
    :root[data-theme="dark"] {
      --fundo: #000000;
      --cartao: #1c1c1e;
      --texto: #f5f5f7;
      --suave: #98989d;
      --linha: #38383a;
      --destaque: #2997ff;
      --erro: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 8px 0 16px; }
    button, input, select {
      font: inherit;
      color: inherit;
    }
    button {
      background: var(--destaque);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
    }
    button.secundario {
      background: transparent;
      color: var(--destaque);
      border: 1px solid var(--linha);
    }
    input[type="password"], input[type="search"], select {
      width: 100%;
      background: var(--cartao);
      border: 1px solid var(--linha);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .cartao {
      background: var(--cartao);
      border-radius: var(--raio);
      padding: 16px;
      margin-bottom: 12px;
    }
    .oculto { display: none !important; }
    .erro { color: var(--erro); min-height: 1.2em; margin: 8px 0 0; }
    .suave { color: var(--suave); font-size: 0.9rem; }

    /* Entrada */
    #entrada { max-width: 420px; margin: 12vh 16px 0; }
    @media (min-width: 500px) { #entrada { margin: 12vh auto 0; } }
    #entrada form { display: grid; gap: 12px; }

    /* Barra */
    .barra { display: grid; gap: 10px; margin-bottom: 12px; }
    .linha-filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .linha-filtros select { width: auto; flex: 0 0 auto; }
    .linha-filtros input { flex: 1 1 200px; }
    .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    /* Lista */
    .item {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--cartao);
      color: var(--texto);
      border-radius: var(--raio);
      padding: 14px 16px;
      margin-bottom: 8px;
      border: 1px solid transparent;
    }
    .item:hover, .item:focus-visible { border-color: var(--destaque); outline: none; }
    .item .principal { font-weight: 600; }
    .item .detalhe { color: var(--suave); font-size: 0.9rem; }
    .etiqueta {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--linha);
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Detalhe */
    #detalhe {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 10;
    }
    #detalhe .folha {
      background: var(--cartao);
      color: var(--texto);
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      overflow: auto;
      border-radius: 16px 16px 0 0;
      padding: 16px;
    }
    dl { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 8px 12px; margin: 12px 0 0; }
    dt { color: var(--suave); }
    dd { margin: 0; word-break: break-word; white-space: pre-wrap; }
    .mascarado { letter-spacing: 2px; }
    @media (min-width: 720px) {
      #detalhe { align-items: center; }
      #detalhe .folha { border-radius: var(--raio); }
    }
  </style>
</head>
<body>

  <section id="entrada" class="cartao">
    <h1>Painel de registros</h1>
    <form id="form-entrada" autocomplete="off">
      <label for="senha-painel" class="suave">Senha do painel</label>
      <input id="senha-painel" type="password" required placeholder="Cole a senha">
      <button type="submit">Entrar</button>
      <p id="erro-entrada" class="erro" role="alert"></p>
    </form>
  </section>

  <main id="painel" class="oculto">
    <div class="topo">
      <h1>Registros</h1>
      <button type="button" class="secundario" id="sair">Sair</button>
    </div>

    <div class="barra">
      <div class="linha-filtros">
        <select id="filtro-tipo" aria-label="Tipo">
          <option value="">Contratos e OS</option>
          <option value="contrato">Só contratos</option>
          <option value="os">Só OS</option>
        </select>
        <input id="busca" type="search" placeholder="Buscar por nome, CPF, modelo, número…" aria-label="Buscar">
        <button type="button" class="secundario" id="atualizar">Atualizar</button>
      </div>
      <p id="resumo" class="suave" aria-live="polite"></p>
      <p id="erro-lista" class="erro" role="alert"></p>
    </div>

    <div id="lista"></div>
  </main>

  <div id="detalhe" class="oculto" role="dialog" aria-modal="true" aria-labelledby="detalhe-titulo">
    <div class="folha">
      <div class="topo">
        <h2 id="detalhe-titulo" style="font-size:1.15rem;margin:0"></h2>
        <button type="button" class="secundario" id="fechar">Fechar</button>
      </div>
      <div style="margin-top:12px">
        <button type="button" id="baixar-pdf">Baixar PDF</button>
        <button type="button" id="excluir" style="background:transparent;color:var(--erro);border:1px solid var(--erro);margin-left:8px">Excluir</button>
        <p id="erro-pdf" class="erro" role="alert"></p>
      </div>
      <dl id="detalhe-campos"></dl>
    </div>
  </div>

<script src="js/metricas-contrato.js"></script>
<script src="js/metricas-os.js"></script>
<script src="js/contrato.js"></script>
<script src="js/os.js"></script>
<script src="js/pdf-contrato.js"></script>
<script src="js/pdf-os.js"></script>
<script>
(function () {
  'use strict';

  const API = 'https://lz-registros.netlify.app/.netlify/functions/listar';
  const CHAVE_SESSAO = 'lz-painel-senha';

  const $ = (id) => document.getElementById(id);

  const ROTULOS = {
    nome: 'Cliente', cpf: 'CPF', endereco: 'Endereço', cidade: 'Cidade',
    celular: 'Celular', email: 'E-mail', telefone: 'Telefone',
    numero: 'Nº da OS', dataTexto: 'Data', data: 'Data', modelo: 'Modelo', cor: 'Cor',
    senha: 'Senha do aparelho', padrao: 'Padrão', perguntas: 'Estado do aparelho',
    servicos: 'Serviços', arquivo: 'Nome do arquivo', imei1: 'IMEI 1', imei2: 'IMEI 2',
    bateria: 'Bateria', preco: 'Preço', desconto: 'Desconto', total: 'Total',
    forma: 'Forma de pagamento', recebimento: 'Recebimento', outros: 'Outros',
    acessorios: 'Acessórios', detalhe: 'Detalhe', cnpj: 'CNPJ',
    assinaturaCliente: 'Assinatura do cliente', assinaturaLoja: 'Assinatura da loja',
    assinaturaTecnico: 'Assinatura do técnico',
  };

  let registros = [];
  let tipoAtual = '';
  let indiceAberto = -1;

  /* Guarda a senha só nesta aba. Se o storage estiver bloqueado, o painel funciona sem ele. */
  function lerSenhaSalva() {
    try { return sessionStorage.getItem(CHAVE_SESSAO) || ''; } catch (e) { return ''; }
  }
  function salvarSenha(valor) {
    try { valor ? sessionStorage.setItem(CHAVE_SESSAO, valor) : sessionStorage.removeItem(CHAVE_SESSAO); } catch (e) {}
  }

  function escapar(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatarData(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }

  function textoDeValor(valor) {
    if (valor === null || valor === undefined || valor === '') return '';
    if (Array.isArray(valor)) {
      return valor.map((item) => {
        if (item && typeof item === 'object' && 'texto' in item) {
          const nota = item.nota ? ` (${item.nota})` : '';
          return `${item.texto}: ${item.resposta || '—'}${nota}`;
        }
        return typeof item === 'object' ? JSON.stringify(item) : String(item);
      }).join('\n');
    }
    if (typeof valor === 'object') return JSON.stringify(valor, null, 2);
    return String(valor);
  }

  function rotulo(chave) {
    return ROTULOS[chave] || chave;
  }

  /* Mostra o nome do cliente, o tipo e a data no cartão da lista. */
  function resumoDo(reg) {
    const d = reg.dados || {};
    const titulo = d.nome || '(sem nome)';
    const tipo = reg.tipo === 'os' ? 'OS' : 'Contrato';
    const numero = d.numero ? ` · Nº ${escapar(d.numero)}` : '';
    const modelo = d.modelo ? ` · ${escapar(d.modelo)}` : '';
    return { titulo, tipo, numero, modelo };
  }

  function desenharLista() {
    const busca = $('busca').value.trim().toLowerCase();
    const digitos = busca.replace(/\D/g, '');
    const filtrados = registros.filter((reg) => {
      if (tipoAtual && reg.tipo !== tipoAtual) return false;
      if (!busca) return true;
      /* Sem as assinaturas: o PNG em base64 tem muitos dígitos e geraria resultados falsos. */
      const dadosBusca = Object.fromEntries(Object.entries(reg.dados || {}).filter(([chave]) => !/^assinatura/.test(chave)));
      const texto = JSON.stringify(dadosBusca).toLowerCase();
      if (texto.includes(busca)) return true;
      return digitos.length >= 3 && texto.replace(/\D/g, '').includes(digitos);
    });

    $('resumo').textContent = `${filtrados.length} de ${registros.length} registro(s)`;
    const lista = $('lista');
    if (!filtrados.length) {
      lista.innerHTML = '<p class="suave">Nenhum registro encontrado.</p>';
      return;
    }
    lista.innerHTML = filtrados.map((reg) => {
      const r = resumoDo(reg);
      return `<button type="button" class="item" data-indice="${registros.indexOf(reg)}">
        <div class="principal"><span class="etiqueta">${r.tipo}</span>${escapar(r.titulo)}</div>
        <div class="detalhe">${escapar(formatarData(reg.criadoEm))}${r.numero}${r.modelo}</div>
      </button>`;
    }).join('');
  }

  function abrirDetalhe(indice) {
    const reg = registros[indice];
    if (!reg) return;
    indiceAberto = indice;
    $('erro-pdf').textContent = '';
    const d = reg.dados || {};
    const r = resumoDo(reg);
    $('detalhe-titulo').textContent = `${r.tipo} · ${r.titulo}`;

    const campos = Object.entries(d).map(([chave, valor]) => {
      /* Assinatura salva como imagem: mostra o desenho, não o texto do PNG. */
      if (/^assinatura/.test(chave) && typeof valor === 'string' && valor.startsWith('data:image/')) {
        return `<dt>${escapar(rotulo(chave))}</dt><dd><img src="${escapar(valor)}" alt="" style="display:block;max-width:100%;background:#fff;border:1px solid var(--linha);border-radius:8px"></dd>`;
      }
      let texto = textoDeValor(valor);
      if (!texto) return '';
      const mascarar = /senha/i.test(chave);
      const conteudo = mascarar
        ? `<span class="mascarado" data-texto="${escapar(texto)}">••••••</span>
           <button type="button" class="secundario" data-revelar style="padding:2px 10px;margin-left:8px">Mostrar</button>`
        : escapar(texto);
      return `<dt>${escapar(rotulo(chave))}</dt><dd>${conteudo}</dd>`;
    }).join('');

    $('detalhe-campos').innerHTML =
      `<dt>Registrado em</dt><dd>${escapar(formatarData(reg.criadoEm))}</dd>` + campos;
    $('detalhe').classList.remove('oculto');
  }

  function fecharDetalhe() {
    $('detalhe').classList.add('oculto');
  }

  /* Apaga o registro no servidor. Ele só sai da lista depois da confirmação do servidor. */
  async function excluirRegistro() {
    const reg = registros[indiceAberto];
    if (!reg) return;
    const nome = (reg.dados && reg.dados.nome) || reg.id;
    const rotulo = reg.tipo === 'os' ? 'a OS' : 'o contrato';
    if (!window.confirm(`Excluir ${rotulo} de ${nome}? Isso não pode ser desfeito.`)) return;

    const botao = $('excluir');
    const erro = $('erro-pdf');
    erro.textContent = '';
    botao.disabled = true;
    try {
      const url = `https://lz-registros.netlify.app/.netlify/functions/excluir?tipo=${encodeURIComponent(reg.tipo)}&id=${encodeURIComponent(reg.id)}`;
      const resposta = await fetch(url, {
        method: 'DELETE',
        headers: { authorization: `Bearer ${lerSenhaSalva()}` },
        cache: 'no-store',
      });
      if (resposta.status === 401) {
        sair('Senha incorreta. Entre de novo.');
        return;
      }
      /* 404 quer dizer que já não existe: tira da lista do mesmo jeito. */
      if (!resposta.ok && resposta.status !== 404) throw new Error('resposta');
      registros.splice(indiceAberto, 1);
      indiceAberto = -1;
      fecharDetalhe();
      desenharLista();
    } catch (e) {
      erro.textContent = 'Não foi possível excluir. Verifique a internet e tente de novo.';
    } finally {
      botao.disabled = false;
    }
  }

  /* Gera o PDF no próprio navegador, com o mesmo código dos formulários, a partir do registro salvo. */
  async function baixarPdf() {
    const reg = registros[indiceAberto];
    if (!reg) return;
    const botao = $('baixar-pdf');
    const erro = $('erro-pdf');
    erro.textContent = '';
    botao.disabled = true;
    botao.textContent = 'Gerando…';
    try {
      const d = reg.dados || {};
      const nome = d.arquivo || `${reg.tipo === 'os' ? 'OS' : 'CONTRATO'}_${d.numero || reg.id}`;
      if (reg.tipo === 'os') {
        const bytes = await window.PdfOs.montar(window.OrdemServico.montar(d), nome);
        window.PdfOs.baixar(bytes, nome);
      } else {
        const bytes = await window.PdfContrato.montar(window.Contrato.montar(d), nome);
        window.PdfContrato.baixar(bytes, nome);
      }
    } catch (e) {
      erro.textContent = 'Não foi possível gerar o PDF deste registro.';
    } finally {
      botao.disabled = false;
      botao.textContent = 'Baixar PDF';
    }
  }

  async function buscarRegistros() {
    const senha = lerSenhaSalva();
    $('erro-lista').textContent = '';
    $('resumo').textContent = 'Carregando…';
    try {
      const resposta = await fetch(API, { headers: { authorization: `Bearer ${senha}` }, cache: 'no-store' });
      if (resposta.status === 401) {
        sair('Senha incorreta. Entre de novo.');
        return;
      }
      if (!resposta.ok) throw new Error('resposta');
      const corpo = await resposta.json();
      registros = (corpo.registros || []).slice().sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
      desenharLista();
    } catch (erro) {
      $('resumo').textContent = '';
      $('erro-lista').textContent = 'Não foi possível carregar. Verifique a internet e tente de novo.';
    }
  }

  function entrar() {
    $('painel').classList.remove('oculto');
    $('entrada').classList.add('oculto');
    buscarRegistros();
  }

  function sair(mensagem) {
    salvarSenha('');
    registros = [];
    $('lista').innerHTML = '';
    $('painel').classList.add('oculto');
    $('entrada').classList.remove('oculto');
    $('senha-painel').value = '';
    $('erro-entrada').textContent = mensagem || '';
    $('senha-painel').focus();
  }

  $('form-entrada').addEventListener('submit', (evento) => {
    evento.preventDefault();
    const senha = $('senha-painel').value.trim();
    if (!senha) return;
    salvarSenha(senha);
    $('erro-entrada').textContent = '';
    entrar();
  });

  $('sair').addEventListener('click', () => sair(''));
  $('atualizar').addEventListener('click', buscarRegistros);
  $('filtro-tipo').addEventListener('change', (e) => { tipoAtual = e.target.value; desenharLista(); });
  $('busca').addEventListener('input', desenharLista);

  $('lista').addEventListener('click', (evento) => {
    const item = evento.target.closest('[data-indice]');
    if (item) abrirDetalhe(Number(item.dataset.indice));
  });

  $('detalhe-campos').addEventListener('click', (evento) => {
    const botao = evento.target.closest('[data-revelar]');
    if (!botao) return;
    const alvo = botao.previousElementSibling;
    const mostrando = alvo.dataset.mostrando === '1';
    alvo.textContent = mostrando ? '••••••' : alvo.dataset.texto;
    alvo.dataset.mostrando = mostrando ? '0' : '1';
    alvo.classList.toggle('mascarado', mostrando);
    botao.textContent = mostrando ? 'Mostrar' : 'Ocultar';
  });

  $('fechar').addEventListener('click', fecharDetalhe);
  $('baixar-pdf').addEventListener('click', baixarPdf);
  $('excluir').addEventListener('click', excluirRegistro);
  $('detalhe').addEventListener('click', (evento) => { if (evento.target.id === 'detalhe') fecharDetalhe(); });
  document.addEventListener('keydown', (evento) => { if (evento.key === 'Escape') fecharDetalhe(); });

  if (lerSenhaSalva()) entrar();
})();
</script>
</body>
</html>
